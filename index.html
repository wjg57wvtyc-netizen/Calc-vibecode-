<style>
:root{--bg:#f3f5f7;--ink:#14202b;--mute:#5d6b78;--acc:#0b5cad;--line:#d8dee4;--card:#fff;--inbg:#f7f9fb}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--ink:#e8eef3;--mute:#93a3b1;--acc:#6db0f5;--line:#2b3946;--card:#18222b;--inbg:#111a22}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif}
.box{box-sizing:border-box;width:min(360px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h1{margin:0 0 4px;font-size:22px}p{color:var(--mute);margin:4px 0 0;font-size:14px}
label.l{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,button{display:block;width:100%;box-sizing:border-box;font:inherit;border-radius:10px;padding:12px}
input{border:1px solid var(--line);background:var(--inbg);color:var(--ink);font-weight:600}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{border:0;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;margin-top:12px}
@media (prefers-color-scheme:dark){button:not(.lnk):not(.eye){color:#06121f}}
.lnk{background:transparent;color:var(--mute);font-weight:500;font-size:14px;padding:6px;margin-top:8px}
input:disabled,button:disabled{opacity:.55;cursor:default}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin-top:12px}.ck input{width:auto;margin:0}
.msg{color:var(--mute);font-size:14px;margin-top:10px}.msg:empty{display:none}
[hidden]{display:none}
.pw{display:block;position:relative}.pw .eye{position:absolute;top:0;right:0;bottom:0;width:46px;height:auto;margin:0;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:10px;color:var(--mute);cursor:pointer;-webkit-tap-highlight-color:transparent}.pw input{padding-right:48px}
@keyframes sp{to{transform:rotate(360deg)}}.busy::before{content:"";display:inline-block;width:16px;height:16px;margin-right:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
</style></head><body>
<div class="box">
<form id="lf" autocomplete="on"><h1>Ф1</h1><p id="lsub"></p>

<div id="lrep" hidden><label class="l" for="lp2">Повторите пароль</label><span class="pw"><input id="lp2" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false"><button type="button" class="eye" aria-label="Показать пароль" aria-pressed="false"></button></span></div>
<label class="ck"><input type="checkbox" id="rm" checked> Запомнить на этом устройстве</label>
<button id="lgo">Войти</button><div class="msg" id="lmsg" role="status"></div>
<button type="button" class="lnk" id="tof">Войти паролем приложения</button></form>

<button id="go">Войти</button><div class="msg" id="msg" role="status"></div>

// пароль уходит на сервер только как PBKDF2(пароль, логин) — так же, как во входе внутри приложения
async function ph(name,pw){var b=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveBits']);
 var r=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:E.encode('f1u:'+name.trim().replace(/\s+/g,' ').toLowerCase()),iterations:100000,hash:'SHA-256'},b,256));

 $('lp').setAttribute('autocomplete',m==='set'?'new-password':'current-password')}
$('lu').oninput=function(){if(MODE==='set')setMode('login')};

   if(!r.pk){lmsg('Вход выполнен, но сервер ещё не обновлён. Войдите паролем приложения.');return}
   try{await openWith(await rawKey(r.pk),$('rm').checked);return}catch(x){lmsg('Ключ на сервере не подходит к этой версии сайта. Сообщите администратору.');return}}
  if(r.need==='set'){setMode('set','Первый вход для «'+r.n+'»: придумайте пароль и повторите его.');$('lp2').focus();return}

  if(r.error==='set')setMode('login');

   key:'Сервер ещё не обновлён. Войдите паролем приложения.',locked:'Слишком много неверных попыток. Подождите '+Math.ceil((r.wait||60)/60)+' мин.'}[r.error]||'Не получилось войти')}
 catch(x){lmsg('Нет связи с сервером. Вход по логину возможен только онлайн.')}
 finally{$('lgo').disabled=false;$('lgo').classList.remove('busy')}};

// ---- запуск: запомненный ключ → сразу открыть; есть вход по логину → попросить ключ у сервера ----
function busy(on){$('lgo').disabled=on;$('lgo').classList.toggle('busy',on)}
async function auto(){
 var k=store('f1k');if(k){try{await openWith(await rawKey(k),false);return}catch(x){store('f1k',null)}}
 var s=null;try{s=JSON.parse(store('f1u')||'null')}catch(x){}
 if(s&&s.tok){try{var r=await api({op:'pk',tok:s.tok});if(r&&r.ok&&r.pk){await openWith(await rawKey(r.pk),true);return}}catch(x){}
  $('lu').value=s.u||''}
 busy(false);($('lu').value?$('lp'):$('lu')).focus()}
eyes();busy(true);auto();
