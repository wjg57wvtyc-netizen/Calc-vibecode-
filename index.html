<style>
:root{--bg:#f3f5f7;--ink:#14202b;--mute:#5d6b78;--acc:#0b5cad;--line:#d8dee4;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--ink:#e8eef3;--mute:#93a3b1;--acc:#6db0f5;--line:#2b3946;--card:#18222b}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif}
.box{box-sizing:border-box;width:min(360px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h1{margin:0 0 6px;font-size:22px}p{color:var(--mute);margin:6px 0;font-size:14px}
input,button{display:block;width:100%;box-sizing:border-box;font:inherit;border-radius:10px;padding:12px;margin-top:10px}
input{border:1px solid var(--line);background:transparent;color:var(--ink)}
button{border:0;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
input:disabled,button:disabled{opacity:.55;cursor:default}
.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin-top:10px}.ck input{width:auto;margin:0}
#msg,#cmsg,#dmsg{color:var(--mute);font-size:14px;min-height:1.3em;margin-top:10px}
textarea{display:block;width:100%;box-sizing:border-box;margin-top:10px;font:12px ui-monospace,Menlo,monospace;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px}
[hidden]{display:none}
.pw{display:block;position:relative}.pw .eye{position:absolute;top:0;right:0;bottom:0;width:46px;height:auto;margin:0;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:10px;color:var(--mute);cursor:pointer;-webkit-tap-highlight-color:transparent}.pw .eye:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}.pw{margin-top:10px}.pw input{margin-top:0;padding-right:48px}
#msg:empty,#cmsg:empty,#dmsg:empty{min-height:0;margin-top:0}
</style></head><body>
