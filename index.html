<style>
:root{--bg:#f3f5f7;--ink:#14202b;--mute:#5d6b78;--acc:#0b5cad;--line:#d8dee4;--card:#fff}

button{border:0;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
button.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
#msg{color:var(--mute);font-size:14px;min-height:1.3em;margin-top:10px}
[hidden]{display:none}
</style></head><body>

function b2u(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function say(t){$('msg').textContent=t}
async function dec(key){var p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(D.iv)},key,b2u(D.ct));return new TextDecoder().decode(p)}
function start(html){document.open();document.write(html);document.close()}
async function derive(pw){var base=await crypto.subtle.importKey('raw',E.encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(D.salt),iterations:D.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function offerBio(key){return new Promise(async function(res){
 if(!window.PublicKeyCredential||store('f1bio'))return res();
 try{if(!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()))return res()}catch(e){return res()}

 $('no').onclick=function(){res()};

  var c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Ф1'},

   authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
  var raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));
  store('f1bio',JSON.stringify({id:u2b(new Uint8Array(c.rawId)),k:u2b(raw)}));
 }catch(e){}res()}})}
